<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baza Vita</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF3F3; --surface:#FFFFFF; --ink:#0F2027; --muted:#5D7178; --line:#D7E2E3;
  --lagoon:#0E9E97; --lagoon-ink:#FFFFFF; --sun:#F0A93B; --chip:#E3EEEE; --shade:rgba(15,32,39,.08);
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B151A; --surface:#13222A; --ink:#E6F0F0; --muted:#8FA5AB; --line:#24363F;
  --lagoon:#2CC4B8; --lagoon-ink:#04201E; --sun:#F3B65A; --chip:#1B2E37; --shade:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.app{max-width:440px;margin:0 auto;padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.lotsearch{display:flex;gap:6px;align-items:center;background:var(--surface);border-radius:12px;padding:6px 6px 6px 10px;box-shadow:0 4px 12px var(--shade)}
.lotsearch input{width:64px;border:0;background:none;font:inherit;font-weight:700;color:var(--ink);outline:none}
.lotsearch button{background:var(--chip);border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px}
.picker{background:var(--surface);border-radius:22px;padding:14px 10px 12px;box-shadow:0 10px 30px var(--shade)}
.picker h2{font-family:var(--f-display);font-size:15px;font-weight:500;margin:4px 8px 10px}
.wheels{position:relative;display:grid;grid-template-columns:1.5fr .9fr 1.15fr;height:220px}
.wheels::before{content:"";position:absolute;left:4px;right:4px;top:50%;height:40px;transform:translateY(-50%);background:var(--chip);border-radius:12px;pointer-events:none}
.col{position:relative;min-width:0}
.col label{position:absolute;top:-2px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);z-index:2}
.wheel{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;perspective:400px;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel ul{list-style:none;margin:0;padding:90px 0}
.wheel li{height:40px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:17px;font-weight:500;white-space:nowrap;color:var(--muted);user-select:none}
.wheel li.on{color:var(--ink);font-weight:700}
.wheel li small{font-size:11px;color:var(--muted);margin-left:5px;font-weight:500}
.go{margin-top:12px;width:100%;background:var(--lagoon);color:var(--lagoon-ink);border-radius:16px;padding:15px;font-weight:700;font-size:16px}
.go:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rhead h3{font-family:var(--f-display);font-weight:500;font-size:15px;margin:0;min-width:0}
.rhead button{font-size:13px;color:var(--lagoon);font-weight:700;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 6px 18px var(--shade)}
.ph{position:relative;aspect-ratio:16/10;width:100%;display:flex;align-items:flex-end;padding:12px;color:#fff;overflow:hidden;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.45));pointer-events:none}
.ph .trk{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ph .trk::-webkit-scrollbar{display:none}
.ph .trk img{position:static;flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always}
.ph .pc{position:absolute;top:10px;right:10px;z-index:2;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none}
.ph .dots{position:absolute;left:0;right:0;bottom:8px;z-index:2;display:flex;justify-content:center;gap:4px;pointer-events:none}
.ph .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:background .2s,transform .2s}
.ph .dots i.on{background:#fff;transform:scale(1.25)}
.ph .lot,.ph .area{position:relative;z-index:1;pointer-events:none}
.ph .lot{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.ph .area{font-family:var(--f-display);font-size:21px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.name{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--chip);color:var(--muted)}
.tag.own{color:var(--lagoon)} .tag.apt{color:#6B5BD6} .tag.yr{color:var(--sun)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-family:var(--f-display);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.price small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.add{border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px;background:var(--chip);white-space:nowrap}
.add[aria-pressed="true"]{background:var(--lagoon);color:var(--lagoon-ink)}
.empty,.state{text-align:center;color:var(--muted);padding:30px 10px}
.more{background:var(--surface);border-radius:14px;padding:13px;font-weight:700;box-shadow:0 4px 12px var(--shade)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 35%);z-index:20}
.dock-in{max-width:440px;margin:0 auto;display:flex;gap:10px}
.dock button{flex:1;border-radius:16px;padding:14px;font-weight:700}
.back{flex:0 0 auto!important;background:var(--surface);box-shadow:0 4px 14px var(--shade)}
.basket{background:var(--ink);color:var(--bg);display:flex;justify-content:center;gap:8px;align-items:center}
.basket b{background:var(--sun);color:#1d1406;border-radius:999px;min-width:24px;padding:2px 8px;font-size:13px}
.basket:disabled{opacity:.35;cursor:default}
.scrim{position:fixed;inset:0;background:rgba(5,12,15,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
.sheet h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.field input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.mk{display:flex;align-items:center;gap:12px}
.mk input{flex:1;accent-color:var(--lagoon)}
.mk output{font-family:var(--f-display);font-size:16px;color:var(--ink);min-width:58px;text-align:right}
.lines{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.line{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.line .n{min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.line .b{color:var(--muted);font-size:12.5px;text-decoration:line-through}
.line .c{font-weight:700}
.line .pi{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.line .pi input{width:64px;padding:6px 6px;border-radius:9px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:15px;font-weight:700;text-align:right}
.line .pi input:focus{outline:none;border-color:var(--lagoon)}
.line .pi.own input{border-color:var(--lagoon)}
.msg-h.tip{margin-top:-4px}
.line .x{background:var(--chip);border-radius:8px;width:28px;height:28px;font-weight:700}
.msg{background:var(--bg);border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;border:1px dashed var(--line);overflow-wrap:anywhere}
.msg-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.send{background:var(--lagoon);color:var(--lagoon-ink);border-radius:16px;padding:15px;font-weight:700;font-size:16px}
.send:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:40;max-width:90vw;text-align:center}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts a,.acts button{background:var(--chip);border-radius:14px;padding:12px 6px;font-weight:700;font-size:13px;text-align:center;color:var(--ink);text-decoration:none}
.acts .off{opacity:.4;pointer-events:none}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.topr{display:flex;gap:8px;align-items:center}
.plus{width:40px;height:40px;border-radius:12px;background:var(--lagoon);color:var(--lagoon-ink);font-size:22px;font-weight:700;line-height:1;box-shadow:0 4px 12px var(--shade)}
.go2{margin-top:8px;width:100%;background:var(--chip);border-radius:16px;padding:13px;font-weight:700;font-size:15px}
.go2:disabled{opacity:.45}
.tseg{grid-template-columns:1fr 1fr 1fr!important;margin:0 4px 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border-radius:10px;padding:8px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px var(--shade)}
#map{height:max(360px,calc(var(--tg-viewport-stable-height,100vh) - 300px));border-radius:20px;overflow:hidden;background:var(--chip);z-index:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lagoon);margin-right:5px;vertical-align:-1px}
.legend .dot.ap{background:transparent;border:2px dashed var(--lagoon);width:9px;height:9px}
.pop{display:flex;flex-direction:column;gap:3px;font-family:var(--f-body);color:#0F2027}
.pop img{width:100%;height:110px;object-fit:cover;border-radius:10px;margin-bottom:4px}
.pop b{font-size:14px;line-height:1.25}
.pop span{font-size:12px;color:#5D7178}
.pop .pp{font-size:14px;color:#0F2027;font-weight:700}
.pop .pb{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pop .pb button{background:#E3EEEE;border-radius:9px;padding:8px 4px;font-weight:700;font-size:12px;color:#0F2027}
.pop .pb button.on{background:#0E9E97;color:#fff}
.leaflet-popup-content{margin:10px 12px}
.leaflet-popup-content-wrapper{border-radius:14px}
.field select,.field input[type=tel],.field input[type=url]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;-webkit-appearance:none;appearance:none}
.field .sub{font-weight:500;color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--lagoon)}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shot{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--chip)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:700}
.shot .main{position:absolute;left:3px;bottom:3px;background:var(--lagoon);color:var(--lagoon-ink);font-size:10px;font-weight:700;border-radius:6px;padding:2px 5px}
.addph{display:block;text-align:center;background:var(--chip);border:1.5px dashed var(--line);border-radius:14px;padding:14px;font-weight:700;color:var(--ink);cursor:pointer}
.req{color:var(--sun)}
.cmpb{flex:0 0 auto!important;background:var(--surface);box-shadow:0 4px 14px var(--shade)}
.lkres{display:flex;flex-direction:column;gap:10px}
.hit{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;text-align:left;width:100%}
.hit img,.hit .ph0{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--chip)}
.hit b{display:block;font-size:14.5px}
.hit span{font-size:12.5px;color:var(--muted)}
.verdict{border-radius:14px;padding:12px 14px;font-weight:700;font-size:14.5px}
.verdict.yes{background:rgba(14,158,151,.14);color:var(--lagoon)}
.verdict.no{background:rgba(240,169,59,.16);color:#B9771A}
:root[data-theme="dark"] .verdict.no{color:var(--sun)}
.cmpw{overflow-x:auto;margin:0 -14px;padding:0 14px 6px;scrollbar-width:thin}
.cmp{display:grid;gap:0;min-width:min-content}
.cmp>div{padding:9px 8px;border-bottom:1px solid var(--line);font-size:13.5px;overflow-wrap:anywhere}
.cmp .h{color:var(--muted);font-size:12px;font-weight:700;position:sticky;left:0;background:var(--surface);z-index:1}
.cmp .ci img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.cmp .ci .ph0{width:100%;aspect-ratio:4/3;border-radius:12px;background:var(--chip)}
.cmp .best{color:var(--lagoon);font-weight:800}
.cmp .ttl{font-weight:700}
.cmp a,.cmp button.lnk{color:var(--lagoon);font-weight:700;text-decoration:none;font-size:13px;padding:0}
.cmp .rm2{font-size:12px;color:var(--muted);text-decoration:underline;padding:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Baza Vita<small id="sub">Загружаю базу…</small></div>
    <div class="topr"><form class="lotsearch" id="lotf"><input id="loti" enterkeyhint="search" placeholder="#LOT / A1" aria-label="Номер LOT"><button>Найти</button></form><button class="plus" id="plus" aria-label="Добавить виллу" title="Добавить виллу">+</button></div>
  </div>

  <section id="search">
    <div class="picker">
      <h2>Что ищем?</h2>
      <div class="seg tseg" id="tseg"><button data-t="All" aria-pressed="true">Всё</button><button data-t="Villa" aria-pressed="false">🏡 Виллы</button><button data-t="Apartment" aria-pressed="false">🏢 Апартаменты</button></div>
      <div class="wheels">
        <div class="col"><label>Район</label><div class="wheel" id="w-area"><ul></ul></div></div>
        <div class="col"><label>Спальни</label><div class="wheel" id="w-br"><ul></ul></div></div>
        <div class="col"><label>Бюджет, млн</label><div class="wheel" id="w-price"><ul></ul></div></div>
      </div>
      <button class="go" id="go" disabled>Загружаю…</button>
      <button class="go2" id="gomap" disabled>🗺 Показать на карте</button>
      <button class="go2" id="golink" disabled>🔗 Есть ли в базе? Проверить по ссылке</button>
      <div class="hint">Крутите колёсики, число вариантов обновляется сразу</div>
    </div>
  </section>

  <section id="results" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="rhead"><h3 id="rtitle"></h3><button id="sort">Сначала дешевле</button></div>
      <div class="chips" id="chips">
        <button class="chip" data-f="monthly" aria-pressed="false">Помесячно</button>
        <button class="chip" data-f="private" aria-pressed="false">Только частные</button>
        <button class="chip" data-f="phone" aria-pressed="false">С телефоном</button>
        <button class="chip" data-f="photo" aria-pressed="false">С фото</button>
      </div>
      <div class="seg" id="seg"><button data-v="list" aria-pressed="true">Список</button><button data-v="map" aria-pressed="false">Карта</button></div>
      <div class="list" id="list"></div>
      <div id="mapbox" hidden><div id="map"></div><div class="legend" id="legend"></div></div>
    </div>
  </section>
</div>

<div class="dock"><div class="dock-in">
  <button class="back" id="back" hidden>← Поиск</button>
  <button class="basket" id="basket" disabled>Подборка <b id="bcnt">0</b></button>
</div></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const APP_V="49";
/* автообновление: если на сайте вышла новая версия, перезагружаемся на неё (Telegram любит держать старую) */
(async()=>{try{const t=await (await fetch(location.pathname+"?cb="+Date.now(),{cache:"no-store"})).text();const m=t.match(/const APP_V="(\d+)"/);
  if(m&&m[1]!==APP_V){const k="bv_upd_"+m[1];if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,"1");const u=new URL(location.href);u.searchParams.set("v",m[1]);location.replace(u.toString())}}}catch(e){}})();
const API="https://script.google.com/macros/s/AKfycbwCoOvCF13m4e02f9gu0vNkFDvCU2NS-KX3kXNbFHtW0g7zoKR8OOQg4ziWhJAzApWU/exec";
const tg=window.Telegram&&Telegram.WebApp; const initData=tg&&tg.initData||"";
if(tg){tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme==="dark"?"dark":"light";tg.onEvent("themeChanged",()=>document.documentElement.dataset.theme=tg.colorScheme==="dark"?"dark":"light")}
else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";
const hap=t=>{try{const H=tg&&tg.HapticFeedback;if(!H)return;t==="sel"?H.selectionChanged():/^(success|warning|error)$/.test(t)?H.notificationOccurred(t):H.impactOccurred(t)}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PRICES=[0,"10-30","30-50","50-70","70+"];
const BRS=["Любые","1","2","3","4","5+"];
let V=[];
const st={type:"All",view:"list",area:"Все районы",br:"Любые",max:0,sortAsc:true,f:{monthly:false,private:false,phone:false,photo:false},pick:new Map(),custom:{},markup:20,client:"",shown:20};
const mln=p=>(Math.round(p/1e5)/10).toString().replace(".",",");
const ruN=(n,f)=>{const a=n%10,b=n%100;return (a===1&&b!==11)?f[0]:(a>=2&&a<=4&&(b<10||b>=20))?f[1]:f[2]};
const countLabel=n=>st.type==="Apartment"?`апартаменты · ${n}`:st.type==="Villa"?`${n} ${word(n)}`:`${n} ${ruN(n,["объект","объекта","объектов"])}`;
function paintAreaCounts(){const pool=V.filter(v=>st.type==="All"||(v.type||"Villa")===st.type);const c={};pool.forEach(v=>c[v.area]=(c[v.area]||0)+1);
  $("#w-area").querySelectorAll("li").forEach((li,i)=>{const sm=li.querySelector("small");if(!sm)return;const a=li.dataset.a;sm.textContent=a==="Все районы"?pool.length:(c[a]||0)})}
const word=n=>{const a=n%10,b=n%100;return (a===1&&b!==11)?"вилла":(a>=2&&a<=4&&(b<10||b>=20))?"виллы":"вилл"};
const brN=v=>{const n=parseInt(v.br,10)||0;return /\+/.test(v.br)?Math.max(n,5):n};
const img=v=>v.photo?`https://drive.google.com/thumbnail?id=${v.photo}&sz=w800`:"";
const HUE=a=>{let h=0;for(const c of a)h=(h*31+c.charCodeAt(0))%360;return h};
function save(){try{localStorage.setItem("bv_pick",JSON.stringify([...st.pick.keys()]));localStorage.setItem("bv_mk",st.markup);localStorage.setItem("bv_cp",JSON.stringify(st.custom))}catch(e){}}

function matches(v){
  if(st.type!=="All"&&(v.type||"Villa")!==st.type)return false;
  if(st.area!=="Все районы"&&v.area!==st.area)return false;
  if(st.br!=="Любые"){const n=brN(v);if(st.br==="5+"?n<5:n!==+st.br)return false}
  if(st.max){const[a,b]=String(st.max).replace("+","-").split("-").map(Number);const m=v.price/1e6;if(m<a||(b&&m>=b))return false}
  if(st.f.monthly&&v.yearly)return false; if(st.f.private&&!v.own)return false;
  if(st.f.phone&&!v.phone)return false; if(st.f.photo&&!v.photo)return false;
  return v.price>0;
}
const found=()=>V.filter(matches).sort((a,b)=>st.sortAsc?a.price-b.price:b.price-a.price);

function wheel(el,items,label,initial,onPick){
  const ul=el.querySelector("ul");ul.innerHTML=items.map(i=>`<li>${label(i)}</li>`).join("");
  const lis=[...ul.children],H=40;let idx=Math.max(0,items.indexOf(initial)),t;
  const paint=()=>{const c=el.scrollTop/H;lis.forEach((li,i)=>{const d=i-c;li.style.transform=`rotateX(${Math.max(-70,Math.min(70,d*-22))}deg) scale(${1-Math.min(Math.abs(d),3)*.06})`;li.classList.toggle("on",Math.round(c)===i)})};
  el.scrollTop=idx*H;paint();let last=idx;
  el.addEventListener("scroll",()=>{paint();const r=Math.round(el.scrollTop/H);if(r!==last){last=r;hap("sel")}clearTimeout(t);t=setTimeout(()=>{const n=Math.round(el.scrollTop/H);if(n!==idx){idx=n;onPick(items[n]);updCount()}},90)},{passive:true});
  lis.forEach((li,i)=>li.addEventListener("click",()=>el.scrollTo({top:i*H,behavior:"smooth"})));
}
function updCount(){const n=found().length;$("#go").textContent=n?`Показать ${countLabel(n)}`:"Ничего не найдено";$("#go").disabled=!n;$("#gomap").disabled=!n;$("#golink").disabled=!V.length}

function card(v){
  const on=st.pick.has(v.lot),h=HUE(v.area);
  return `<article class="card"><div class="ph" data-open="${esc(v.lot)}" style="background:linear-gradient(135deg,hsl(${h} 50% 40%),hsl(${(h+40)%360} 55% 26%))">
    ${v.photo?`<div class="trk" data-lot="${esc(v.lot)}"><img loading="lazy" alt="" src="${img(v)}" onerror="this.remove()"></div><span class="pc" hidden></span><span class="dots" hidden></span>`:""}

    <div class="body"><div class="name">${esc(v.name)}</div>
      <div class="meta">${v.type==="Apartment"?'<span class="tag apt">🏢 Апартаменты</span>':""}<span class="tag">${esc(v.br)}</span>${v.own?'<span class="tag own">Частное</span>':v.agency?'<span class="tag">Агентство</span>':""}${v.yearly?'<span class="tag yr">Только год</span>':""}${v.phone?'<span class="tag">WhatsApp</span>':""}</div>

}
/* ---------- листаемые фото на карточках ---------- */
const phCache={};let phBusy=0;const phQueue=[];
function photoList(lot){
  if(phCache[lot])return phCache[lot];
  phCache[lot]=new Promise(res=>{phQueue.push(()=>fetch(API+"?api=photos&lot="+encodeURIComponent(lot)).then(r=>r.json()).then(j=>res(j&&j.ok?j.photos||[]:[])).catch(()=>res([])).finally(()=>{phBusy--;pump()}));pump()});
  return phCache[lot];
}
function pump(){while(phBusy<3&&phQueue.length){phBusy++;phQueue.shift()()}}
const thumbUrl=id=>`https://drive.google.com/thumbnail?id=${id}&sz=w800`;
function paintPos(ph){const tr=ph.querySelector(".trk");if(!tr)return;const n=tr.children.length,k=Math.min(n-1,Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth)));
  const pc=ph.querySelector(".pc"),dots=ph.querySelector(".dots");if(n<2){pc.hidden=true;dots.hidden=true;return}
  pc.hidden=false;pc.textContent=`${k+1} / ${n}`;
  if(n<=12){dots.hidden=false;if(dots.children.length!==n)dots.innerHTML="<i></i>".repeat(n);[...dots.children].forEach((d,i)=>d.classList.toggle("on",i===k))}else dots.hidden=true}
function fillGallery(ph){
  const tr=ph.querySelector(".trk");if(!tr||tr.dataset.done)return;tr.dataset.done="1";
  const lot=tr.dataset.lot,v=V.find(x=>x.lot===lot);
  photoList(lot).then(ids=>{ids=ids.filter(id=>!v||id!==v.photo);if(!ids.length||!tr.isConnected)return;
    tr.insertAdjacentHTML("beforeend",ids.map(id=>`<img loading="lazy" alt="" src="${thumbUrl(id)}" onerror="this.remove()">`).join(""));paintPos(ph)});
}
const galIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){fillGallery(e.target);galIO.unobserve(e.target)}}),{rootMargin:"300px 0px"});
function wireGalleries(){
  $("#list").querySelectorAll(".ph").forEach(ph=>{const tr=ph.querySelector(".trk");if(!tr)return;
    galIO.observe(ph);
    let last=-1;tr.addEventListener("scroll",()=>{fillGallery(ph);const k=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));if(k!==last){if(last>=0)hap("sel");last=k}paintPos(ph)},{passive:true});
    tr.addEventListener("touchstart",()=>fillGallery(ph),{passive:true});
  });
}
function renderList(fit){
  const isMap=st.view==="map";$("#list").hidden=isMap;$("#mapbox").hidden=!isMap;$("#sort").hidden=isMap;
  $("#seg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.view));
  const r=found(),part=r.slice(0,st.shown);
  $("#rtitle").textContent=`${st.area==="Все районы"?"Все районы":st.area} · ${st.br==="Любые"?"любые спальни":st.br+"BR"} · ${countLabel(r.length)}`;
  $("#list").innerHTML=r.length?part.map(card).join("")+(r.length>part.length?`<button class="more" id="more">Ещё ${Math.min(20,r.length-part.length)} из ${r.length-part.length}</button>`:""):`<div class="empty">Под эти фильтры ничего нет. Снимите фильтр или поднимите бюджет.</div>`;
  const m=$("#more");if(m)m.onclick=()=>{st.shown+=20;renderList()};
  if(!isMap)wireGalleries();
  if(isMap)renderMap(fit!==false);
}

function openSheet(html){$("#sheetIn").innerHTML='<div class="grab"></div>'+html;$("#sheetIn").querySelectorAll("input:not([type=checkbox]):not([type=file]):not([type=range])").forEach(i=>i.setAttribute("enterkeyhint","done"));$("#scrim").hidden=false;$("#sheet").hidden=false;if(tg&&tg.BackButton)tg.BackButton.show()}
function closeSheet(){hideKb();$("#scrim").hidden=true;$("#sheet").hidden=true;if(tg&&tg.BackButton&&$("#results").hidden)tg.BackButton.hide()}
function hideKb(){const a=document.activeElement;if(a&&a.matches&&a.matches("input,textarea,select"))a.blur();try{tg&&tg.hideKeyboard&&tg.hideKeyboard()}catch(e){}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input:not([type=checkbox]),select")&&!e.target.closest("#lotf")){e.preventDefault();hideKb()}});
document.addEventListener("touchstart",e=>{const a=document.activeElement;if(a&&a.matches&&a.matches("input,textarea")&&!e.target.closest("input,textarea,select,label,button"))hideKb()},{passive:true});

const AREA_C={"Berawa":[-8.6575,115.1395],"Canggu":[-8.6482,115.1340],"Chemagi":[-8.6265,115.0880],"Jimbaran":[-8.7905,115.1610],"Nusa Dua":[-8.8010,115.2290],"Pererenan":[-8.6395,115.1235],"Sanur":[-8.6930,115.2610],"Seminyak":[-8.6905,115.1685],"Seseh":[-8.6335,115.1050],"Tumbak Bayuh":[-8.6225,115.1405],"Ubud":[-8.5069,115.2625],"Uluwatu":[-8.8290,115.0870],"Umalas":[-8.6610,115.1590],"Ungasan":[-8.8250,115.1660]};
let leafletP=null,map=null,layer=null;
function loadLeaflet(){if(leafletP)return leafletP;leafletP=new Promise((res,rej)=>{const l=document.createElement("link");l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(l);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";s.onload=res;s.onerror=()=>{leafletP=null;rej()};document.head.appendChild(s)});return leafletP}
const jit=(lot,k)=>{let h=7;for(const c of lot+k)h=(h*131+c.charCodeAt(0))%100003;return (h/100003-.5)*.014};
function pos(v){if(v.lat&&v.lng)return[v.lat,v.lng,true];const c=AREA_C[v.area];return c?[c[0]+jit(v.lot,"a"),c[1]+jit(v.lot,"b"),false]:null}
function popupHtml(v,exact){const on=st.pick.has(v.lot);return `<div class="pop">${v.photo?`<img src="${img(v)}" alt="" onerror="this.remove()">`:""}<b>${esc(v.name)}</b><span>${esc(v.lot)} · ${esc(v.area)} · ${esc(v.br)}${exact?"":" · место примерное"}</span><span class="pp">${mln(v.price)} млн / мес</span><div class="pb"><button data-open="${esc(v.lot)}">Подробнее</button><button data-add="${esc(v.lot)}" class="${on?"on":""}">${on?"✓ В подборке":"+ В подборку"}</button></div></div>`}
async function renderMap(fit){
  try{await loadLeaflet()}catch(e){$("#legend").textContent="Карта не загрузилась — проверьте интернет";return}
  if(!map){map=L.map("map",{zoomControl:true}).setView([-8.65,115.17],11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
    layer=L.layerGroup().addTo(map);
    map.on("popupopen",ev=>{const el=ev.popup.getElement();
      el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{map.closePopup();openDetail(b.dataset.open)});
      el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{togglePick(b.dataset.add);map.closePopup();renderMap(false)});});}
  layer.clearLayers();const r=found(),pts=[];let approx=0;
  r.forEach(v=>{const p=pos(v);if(!p)return;if(!p[2])approx++;const on=st.pick.has(v.lot);
    L.circleMarker([p[0],p[1]],{radius:p[2]?8:7,weight:2,color:on?"#B9771A":"#0B6F6A",fillColor:on?"#F0A93B":"#0E9E97",fillOpacity:p[2]?.9:.25,dashArray:p[2]?null:"3 3"})
      .bindPopup(popupHtml(v,p[2]),{maxWidth:240,minWidth:200}).addTo(layer);pts.push([p[0],p[1]])});
  if(fit&&pts.length)map.fitBounds(pts,{padding:[28,28],maxZoom:14});
  $("#legend").innerHTML=`<span><i class="dot"></i>точный адрес</span><span><i class="dot ap"></i>примерно, по району</span><span>${r.length} ${word(r.length)}${approx?` · ${approx} без точки`:""}</span>`;
  setTimeout(()=>map.invalidateSize(),60);
}

function shrink(file){return new Promise(res=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.82))};
  im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}

  $("#shots").querySelectorAll("[data-rmph]").forEach(b=>b.onclick=()=>{shots.splice(+b.dataset.rmph,1);paintShots()});
  $("#shots").querySelectorAll("[data-main]").forEach(b=>b.onclick=()=>{const i=+b.dataset.main;if(i){shots.unshift(shots.splice(i,1)[0]);paintShots();hap("sel")}});

async function saveVilla(){
  hideKb();
  if(!initData){toast("Откройте приложение через бота в Telegram");return}
  const g=id=>$("#"+id).value.trim();
  const price=parseFloat(g("a-price").replace(",",".").replace(/[^\d.]/g,""));
  if(!shots.length)return toast("Добавьте хотя бы одно фото");
  if(!g("a-area"))return toast("Выберите район");
  if(!g("a-br"))return toast("Выберите количество спален");
  if(!(price>0))return toast("Укажите цену в месяц");
  const notes=[g("a-kind"),$("#a-year").checked?"только год":"",g("a-notes")].filter(Boolean).join(" · ");
  const b=$("#a-save");b.disabled=true;b.textContent="Загружаю фото… до минуты";
  try{
    const r=await fetch(API,{method:"POST",body:JSON.stringify({action:"addVilla",initData,photos:shots,
      villa:{name:g("a-name"),area:g("a-area"),br:g("a-br"),price:Math.round(price*1e6),phone:g("a-phone"),maps:g("a-maps"),notes,src:g("a-src"),type:($("#a-type [aria-pressed=true]")||{}).dataset?.t||"Villa"}})});
    const j=await r.json();
    if(j.ok){hap("success");closeSheet();toast(`Готово: ${j.lot} в базе`);setTimeout(()=>location.reload(),1800)}
    else{toast(j.error==="auth"?"Откройте через бота в Telegram":(j.error||"Не получилось"));b.disabled=false;b.textContent="Попробовать ещё раз"}
  }catch(e){toast("Нет связи с базой. Попробуйте ещё раз");b.disabled=false;b.textContent="Попробовать ещё раз"}
}
$("#plus").onclick=openAdd;

/* ---------- проверка по ссылке ---------- */
function linkKeys(u){
  u=String(u||"").trim();if(!u)return[];
  let x;try{x=new URL(/^https?:\/\//i.test(u)?u:"https://"+u)}catch(e){return["raw:"+u.toLowerCase()]}
  const h=x.href,keys=[];
  const m=h.match(/(?:posts|permalink|videos|photos|reel)\/(?:[\w.-]+\/)?(\d{6,})/i)||h.match(/[?&](?:story_fbid|multi_permalinks|fbid|v|id)=(\d{6,})/i)||
    h.match(/\/(?:share\/(?:p|r|v)|p)\/([\w-]{6,})/i)||h.match(/maps\.app\.goo\.gl\/([\w-]+)/i)||h.match(/goo\.gl\/maps\/([\w-]+)/i)||
    h.match(/\/rooms\/(\d+)/i)||h.match(/\/hotel\/[\w-]+\/([\w-]+)\.html/i);
  if(m)keys.push("id:"+m[1].toLowerCase());
  const c=h.match(/[@=](-?\d{1,2}\.\d{4,}),\s*(-?\d{2,3}\.\d{4,})/);
  if(c)keys.push("ll:"+(+c[1]).toFixed(4)+","+(+c[2]).toFixed(4));
  keys.push("u:"+(x.hostname.replace(/^(www|m|web|mbasic|l)\./,"")+x.pathname).replace(/\/+$/,"").toLowerCase());
  return keys;
}
function findByLink(u){
  const ks=new Set(linkKeys(u).filter(k=>!/^u:(facebook\.com|maps\.google\.com|google\.com\/maps|maps\.app\.goo\.gl)$/.test(k)));
  if(!ks.size)return[];
  return V.filter(v=>[v.src,v.maps].some(l=>l&&linkKeys(l).some(k=>ks.has(k))));
}
function hitHtml(v){return `<button class="hit" data-hit="${esc(v.lot)}">${v.photo?`<img src="${img(v)}" alt="" onerror="this.outerHTML='<span class=ph0></span>'">`:'<span class="ph0"></span>'}<span><b>${esc(v.lot)} · ${esc(v.name)}</b><span>${esc(v.area)} · ${esc(v.br)} · ${mln(v.price)} млн</span></span></button>`}
function openLinkCheck(pre){
  openSheet(`<h3>Есть ли вилла в базе?</h3>
    <label class="field" for="lk">Ссылка на объявление (Facebook и др.) или Google Maps<input type="url" id="lk" placeholder="https://www.facebook.com/groups/…" value="${esc(pre)}" autocomplete="off"></label>
    <div class="two"><button class="go2" id="lkPaste" style="margin:0">📋 Вставить</button><button class="send" id="lkGo">Проверить</button></div>
    <div class="lkres" id="lkRes"></div>`);
  const run=()=>{hideKb();const u=$("#lk").value.trim();const box=$("#lkRes");
    if(!u){box.innerHTML="";return}
    const hits=findByLink(u);
    if(hits.length){hap("success");box.innerHTML=`<div class="verdict yes">✓ Уже есть в базе${hits.length>1?` — ${hits.length} совпадения`:""}</div>`+hits.map(hitHtml).join("");
      box.querySelectorAll("[data-hit]").forEach(b=>b.onclick=()=>openDetail(b.dataset.hit))}
    else{hap("warning");const fbShare=/facebook\.com\/share\//i.test(u);
      box.innerHTML=`<div class="verdict no">Такой ссылки в базе нет</div>
        <div class="note">${fbShare?"Это ссылка «Поделиться» — она отличается от адреса поста. Откройте пост и скопируйте ссылку из адресной строки, затем проверьте ещё раз. ":""}Сверка идёт по ссылке на объявление и на Google Maps. Виллу без сохранённой ссылки можно найти по району и цене.</div>
        <button class="send" id="lkAdd">+ Добавить эту виллу в базу</button>`;
      $("#lkAdd").onclick=()=>{openAdd();$("#a-src").value=/maps\.|goo\.gl/i.test(u)?"":u;if(/maps\.|goo\.gl/i.test(u))$("#a-maps").value=u}}};
  $("#lkGo").onclick=run;
  $("#lk").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();run()}});
  $("#lkPaste").onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t){$("#lk").value=t.trim();run();return}}catch(e){}$("#lk").focus();toast("Нажмите в поле и выберите «Вставить»")};
  if(pre)run();
}

/* ---------- сравнение вилл ---------- */
function openCompare(){
  const list=[...st.pick.values()];if(list.length<2){toast("Добавьте в подборку хотя бы 2 виллы");return}
  const n=list.length,minP=Math.min(...list.map(v=>v.price||Infinity)),minC=Math.min(...list.map(cp));
  const maxBr=Math.max(...list.map(brN));
  const col=`88px repeat(${n},minmax(148px,1fr))`;
  const row=(label,f)=>`<div class="h">${label}</div>`+list.map(f).join("");
  const html=
    row("",v=>`<div class="ci">${v.photo?`<img src="${img(v)}" alt="" onerror="this.outerHTML='<div class=ph0></div>'">`:'<div class="ph0"></div>'}</div>`)+
    row("Вилла",v=>`<div><div class="ttl">${esc(v.name)}</div><div class="note">${esc(v.lot)}</div></div>`)+
    row("Район",v=>`<div>${esc(v.area)}</div>`)+
    row("Спальни",v=>`<div class="${brN(v)===maxBr&&n>1?"best":""}">${esc(v.br)}</div>`)+
    row("Цена владельца",v=>`<div class="${v.price===minP?"best":""}">${mln(v.price)} млн</div>`)+
    row("Цена клиенту",v=>`<div class="${cp(v)===minC?"best":""}">${mln(cp(v))} млн</div>`)+
    row("Срок",v=>`<div>${v.yearly?"только год":"помесячно"}</div>`)+
    row("Кто сдаёт",v=>`<div>${v.own?"частное":v.agency?"агентство":"—"}</div>`)+
    row("Карта",v=>`<div>${v.lat?"📍 точный адрес":v.maps?"📍 ссылка":"—"}</div>`)+
    row("Заметки",v=>`<div class="note">${esc(v.notes||"—")}</div>`)+
    row("",v=>`<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><button class="lnk" data-op="${esc(v.lot)}">Подробнее →</button>${v.folder?`<button class="lnk" data-u="${esc(v.folder)}">📷 Все фото</button>`:""}${v.maps?`<button class="lnk" data-u="${esc(v.maps)}">🗺 Карта</button>`:""}<button class="rm2" data-rm2="${esc(v.lot)}">убрать</button></div>`);
  openSheet(`<h3>Сравнение · ${n} ${word(n)}</h3>
    <div class="note">Лучшее значение в строке выделено цветом. Листайте таблицу вбок.</div>
    <div class="cmpw"><div class="cmp" style="grid-template-columns:${col}">${html}</div></div>
    <button class="send" id="cmpOffer">Перейти к предложению</button>`);
  $("#sheetIn").querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>openDetail(b.dataset.op));
  $("#sheetIn").querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>open(b.dataset.u));
  $("#sheetIn").querySelectorAll("[data-rm2]").forEach(b=>b.onclick=()=>{delete st.custom[b.dataset.rm2];togglePick(b.dataset.rm2);if(!$("#results").hidden)renderList(false);st.pick.size>=2?openCompare():closeSheet()});
  $("#cmpOffer").onclick=openOffer;
}

const autoP=v=>Math.round(v.price*(1+st.markup/100)/5e5)*5e5;
const cp=v=>st.custom[v.lot]>0?st.custom[v.lot]:autoP(v);
const idr=n=>n.toLocaleString("ru-RU").replace(/ /g," ");
function offerText(){
  const list=[...st.pick.values()];
  return `Здравствуйте${st.client?", "+st.client:""}! Подобрала для вас ${list.length} ${word(list.length)} на Бали 🌴\n\nФото, цены и расположение на карте — по ссылке:\n🔗 ссылка появится после отправки\n\nКакой вариант посмотрим первым?\n\nНа странице: `+
    list.map(v=>`${v.lot} · ${v.area} · ${v.br} · ${mln(cp(v))} млн`).join("; ");
}
function openOffer(){
  openSheet(`<h3>Предложение клиенту</h3>
    <label class="field" for="cl">Имя клиента<input type="text" id="cl" value="${esc(st.client)}" autocomplete="off" placeholder="Например, Анна"></label>
    <div class="field">Наценка<div class="mk"><input type="range" id="mk" min="0" max="50" step="5" value="${st.markup}"><output id="mko"></output></div></div>
    <div class="lines" id="lines"></div>
    <div class="msg-h tip">Цену для клиента можно поправить вручную (в млн IDR). Пустое поле — цена по наценке.</div>
    <div class="msg-h">Бот пришлёт альбом и сообщение со ссылкой на страницу-подборку — перешлите клиенту</div>
    <div class="msg" id="msg"></div>
    <button class="send" id="send"></button>`);
  const paint=()=>{const list=[...st.pick.values()];
    $("#lines").innerHTML=list.map(v=>`<div class="line"><div class="n">${esc(v.name)}<small>${esc(v.lot)} · ${esc(v.area)} · ${esc(v.br)}</small></div><span class="b">${mln(v.price)}</span><label class="pi${st.custom[v.lot]>0?" own":""}"><input type="text" inputmode="decimal" data-cp="${esc(v.lot)}" value="${mln(cp(v))}" aria-label="Цена для клиента, млн">млн</label><button class="x" data-rm="${esc(v.lot)}" aria-label="Убрать">×</button></div>`).join("");
    $("#msg").textContent=offerText();$("#mko").textContent="+"+st.markup+"%";
    $("#send").textContent=`Отправить в чат · ${list.length} ${word(list.length)}`;$("#send").disabled=!list.length||list.length>20;
    if(list.length>20)$("#send").textContent="Максимум 20 вилл в одном предложении";
    $("#lines").querySelectorAll("[data-cp]").forEach(inp=>{
      inp.onfocus=()=>inp.select();
      inp.oninput=()=>{const n=parseFloat(inp.value.replace(",",".").replace(/[^\d.]/g,""));
        if(n>0)st.custom[inp.dataset.cp]=Math.round(n*1e6);else delete st.custom[inp.dataset.cp];
        inp.parentNode.classList.toggle("own",n>0);$("#msg").textContent=offerText();save()};
      inp.onblur=()=>{const v=st.pick.get(inp.dataset.cp);if(v)inp.value=mln(cp(v))};});
    $("#lines").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{delete st.custom[b.dataset.rm];togglePick(b.dataset.rm);paint();if(!$("#results").hidden)renderList()});};
  paint();
  $("#mk").oninput=e=>{st.markup=+e.target.value;paint();save();hap("sel")};
  $("#cl").oninput=e=>{st.client=e.target.value.trim();paint()};
  $("#send").onclick=sendOffer;
}
async function sendOffer(){
  hideKb();
  if(!initData){toast("Откройте приложение через бота в Telegram, чтобы отправить");return}
  const b=$("#send");b.disabled=true;b.textContent="Отправляю…";
  try{
    const r=await fetch(API,{method:"POST",body:JSON.stringify({action:"offer",initData,lots:[...st.pick.keys()],markup:st.markup,prices:Object.fromEntries([...st.pick.values()].map(v=>[v.lot,cp(v)])),client:st.client})});
    const j=await r.json().catch(()=>({ok:true}));
    if(j.ok){hap("success");closeSheet();toast("Готово: предложение в чате с ботом — перешлите его клиенту");st.pick.clear();st.custom={};updBasket();save();if(!$("#results").hidden)renderList();if(tg)setTimeout(()=>tg.close(),1600)}
    else{toast("Не получилось: "+(j.error||"ошибка"));b.disabled=false;b.textContent="Попробовать ещё раз"}
  }catch(e){toast("Нет связи с базой. Попробуйте ещё раз");b.disabled=false;b.textContent="Попробовать ещё раз"}
}
$("#basket").onclick=openOffer;
$("#golink").onclick=()=>openLinkCheck("");
let tt;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2800)}

async function load(){
  try{
    const r=await fetch(API+"?api=villas&init="+encodeURIComponent(initData));
    const j=await r.json();
    if(!j.ok){$("#sub").textContent=j.error==="auth"?"Откройте через бота в Telegram":"Ошибка загрузки";$("#go").textContent="Нет доступа";return}
    V=j.villas;
    const counts={};V.forEach(v=>counts[v.area]=(counts[v.area]||0)+1);
    const areas=["Все районы",...Object.keys(counts).filter(a=>a!=="Other").sort()];
    wheel($("#w-area"),areas,a=>a==="Все районы"?`Все<small>${V.length}</small>`:`${esc(a)}<small>${counts[a]}</small>`,st.area,v=>st.area=v);
    $("#w-area").querySelectorAll("li").forEach((li,i)=>li.dataset.a=areas[i]);
    wheel($("#w-br"),BRS,b=>b==="Любые"?"Любые":b+"BR",st.br,v=>st.br=v);
    wheel($("#w-price"),PRICES,p=>p?String(p).replace("-","–"):"любой",st.max,v=>st.max=v);
    {const na=V.filter(v=>v.type==="Apartment").length,nv=V.length-na;$("#sub").textContent=`${nv} ${word(nv)}${na?` · ${na} апарт.`:""} в базе`}
    try{const p=JSON.parse(localStorage.getItem("bv_pick")||"[]");p.forEach(l=>{const v=V.find(x=>x.lot===l);if(v)st.pick.set(l,v)});const m=localStorage.getItem("bv_mk");if(m!==null)st.markup=+m;st.custom=JSON.parse(localStorage.getItem("bv_cp")||"{}")||{}}catch(e){}
    updBasket();updCount();
    const op=new URLSearchParams(location.search).get("open");
    if(op==="map"){st.view="map";show("results");renderList()}else if(op==="add")openAdd();else if(op==="link")openLinkCheck("");
  }catch(e){$("#sub").textContent="Нет связи с базой";$("#go").textContent="Обновите позже"}
}
load();
</script>
